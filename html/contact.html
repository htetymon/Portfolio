<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Contact Htet Yee Mon."><title>Contact | Htet Yee Mon</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/contact.css"><script src="../js/main.js" defer></script></head>
  <body>

    <header class="site-header"><a class="site-brand" href="index.html#home" aria-label="Portfolio home">Portfolio</a><button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation"><span aria-hidden="true">☰</span></button><nav id="primary-navigation" class="primary-navigation" aria-label="Main navigation"><ul><li><a href="index.html#home">Home</a></li><li><a href="index.html#about">About</a></li><li><a href="index.html#skills">Skills</a></li><li><a href="index.html#projects">Projects</a></li><li><a href="index.html#contact" aria-current="page">Contact</a></li></ul></nav><button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span aria-hidden="true">◐</span><span class="theme-toggle-label">Theme</span></button></header>
    <main id="main"><section class="contact section contact-page" aria-labelledby="contact-title"><div class="contact-layout"><div class="contact-content"><div class="section-heading"><h1 id="contact-title">Reach Out!</h1><p>Send me a message and I’ll get back to you as soon as I can.</p></div><form id="contact-form" novalidate><div class="form-field"><label for="contact-name">Name</label><input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Your name" required minlength="2" aria-describedby="name-error"><p class="field-error" id="name-error"></p></div><div class="form-field"><label for="contact-email">Email Address</label><input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-error"><p class="field-error" id="email-error"></p></div><div class="form-field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="3" placeholder="Write your message..." required minlength="20" maxlength="500" aria-describedby="message-error message-count"></textarea><p class="field-hint" id="message-count" aria-live="polite" aria-atomic="true">0 / 500 characters</p><p class="field-error" id="message-error"></p></div><button class="button button-primary" type="submit">Send message</button><p id="form-status" class="form-status" role="status" aria-live="polite"></p></form></div><figure class="contact-art"><img src="../assets/images/lightmode-contact.png" alt="Illustration of a person holding a phone" width="480" height="480"></figure></div></section></main>
    <dialog id="message-confirmation" class="message-dialog" aria-labelledby="message-dialog-title" aria-describedby="message-dialog-text"><h2 id="message-dialog-title">Message not sent</h2><p id="message-dialog-text">Demo only. Your message has not been sent.</p><form method="dialog"><button class="button button-primary" type="submit">Close</button></form></dialog>
